[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
addopts = -q -m "not live and not audio"
markers =
    e2e: the real `ainterviewer` command against a stand-in model server (fast, part of the default run)
    live: a real LLM provider; opt in with AINTERVIEWER_LIVE=<provider or URL> and `-m live`
    audio: the real Whisper and Kokoro models (slow, no microphone needed); opt in with `-m audio`
filterwarnings =
    ignore::DeprecationWarning
